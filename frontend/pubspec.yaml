name: vettrack_frontend
description: VetTrack Flutter Frontend Application
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.5.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter
  flutter_bloc: ^8.1.3
  supabase_flutter: ^2.0.0
  firebase_messaging: ^15.2.0
  dio: ^5.4.0
  go_router: ^13.0.0
  get_it: ^7.6.0
  equatable: ^2.0.5
  google_fonts: ^6.1.0
  flutter_secure_storage: ^10.3.1
  firebase_core: ^3.15.2
  qr_flutter: ^4.1.0
  flutter_svg: ^2.0.10
  url_launcher: ^6.3.0 #magaza lnikini acmak icin
  fl_chart: ^0.68.0
  google_sign_in: ^6.2.1
  image_picker: ^1.2.3
  intl: ^0.20.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/icons/
    - assets/images/

