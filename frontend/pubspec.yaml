name: vettrack_frontend
description: VetTrack Flutter Frontend Application
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.5.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_bloc: ^8.1.3
  supabase_flutter: ^2.0.0
  firebase_messaging: ^15.2.0
  dio: ^5.4.0
  go_router: ^13.0.0
  get_it: ^7.6.0
  equatable: ^2.0.5
  google_fonts: ^6.1.0
  flutter_secure_storage: ^10.3.1
  flutter_svg: ^2.0.10
  url_launcher: ^6.3.0 #magaza lnikini acmak icin
  package_info_plus: ^8.0.0 #cihazdaki uygulama sürüm bilgilerini almak için

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/icons/
    - assets/images/

