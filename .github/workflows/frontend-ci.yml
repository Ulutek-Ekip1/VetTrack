name: Flutter CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend
        
    steps:
    - name: Kodu Checkout Et
      uses: actions/checkout@v3

    - name: Flutter Kurulumu
      uses: subosito/flutter-action@v2
      with:
        channel: 'stable'

    - name: Bağımlılıkları Yükle
      run: flutter pub get

    - name: Kodu Analiz Et
      run: flutter analyze