name: Daily Database Backup

on:
  schedule:
    - cron: '0 3 * * *' # Her gece 03:00'te çalışır
  workflow_dispatch:

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: PostgreSQL client kur
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: Veritabanini SQL olarak disari aktar (pg_dump)
        env:
          PGPASSWORD: ${{ secrets.STAGING_DB_PASSWORD }}
        run: |
          pg_dump \
            -h aws-0-eu-west-1.pooler.supabase.com \
            -p 6543 \
            -U postgres.${{ secrets.STAGING_PROJECT_REF }} \
            -d postgres \
            -F p \
            -f db_backup_$(date +%Y-%m-%d).sql

      - name: Yedek dosyasini ziple ve GitHub'da guvenli sakla
        uses: actions/upload-artifact@v4
        with:
          name: staging-db-backup
          path: db_backup_*.sql
          retention-days: 7 # PRD NFR-07 gereği 7 gün boyunca saklar
