openapi: 3.0.3
info:
  title: VetTrack API
  description: |
    Veteriner Tedavi Takip Uygulaması — Backend REST API Sözleşmesi.

    Bu doküman, VetTrack PRD v1.0 ve yol haritası dokümanlarına dayanılarak
    hazırlanmıştır. Tüm endpoint'ler, request/response şemaları, hata kodları
    ve sözleşme kuralları burada tanımlanmıştır.

    ## Kimlik Doğrulama
    - Kayıt ve giriş backend üzerinden yapılır (Supabase Auth arka planda).
    - Başarılı kayıt/giriş sonrası dönen `accessToken`, tüm korumalı endpoint'lere `Authorization: Bearer <token>` header'ında gönderilir.
    - Rol bilgisi JWT claim'inden çıkarılır (`owner`, `vet_staff`, `admin`).

    ## Genel Kurallar
    - JSON alan isimleri **camelCase** formatındadır.
    - Tarih/saat alanları ISO 8601 formatındadır (UTC).
    - UUID formatında ID'ler kullanılır.
    - Tüm hatalar standart `ErrorResponse` formatında döner.
  version: 1.0.0
  contact:
    name: VetTrack Backend Ekibi

servers:
  - url: http://localhost:8080
    description: Lokal geliştirme
  - url: https://vettrack-api.up.railway.app
    description: Production (Railway)

tags:
  - name: Auth
    description: Kimlik doğrulama — kayıt, giriş, şifre sıfırlama, hesap silme
  - name: Profile
    description: Kullanıcı profili yönetimi ve güncelleme
  - name: Pets
    description: Hayvan yönetimi — ekleme, listeleme, güncelleme, kilo geçmişi, fotoğraf
  - name: Visits
    description: Ziyaret yönetimi — hasta bulma, ziyaret başlatma/kapatma, geçmiş
  - name: Treatments
    description: Tedavi girişleri — ilaç, aşı, operasyon, röntgen, tahlil, not
  - name: Recommendations
    description: Bakım önerileri — mama, kum, diğer
  - name: Notifications
    description: Bildirim yönetimi — listeleme, okunmamış sayısı, okundu işaretleme
  - name: Devices
    description: Cihaz yönetimi — FCM token kaydı ve silme
  - name: Clinics
    description: Klinik ve davet yönetimi — davet oluşturma, kabul etme, iptal etme
  - name: AI Chat
    description: Google Gemini tabanlı yapay zeka veteriner danışmanlığı, güvenlik filtreleri ve sohbet geçmişi

# ================================================================
# PATHS
# ================================================================
paths:

  # ---- Auth ----
  /auth/register:
    post:
      tags: [Auth]
      summary: Kayıt ol
      description: Yeni kullanıcı kaydı oluşturur ve JWT döner.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: Kullanıcı oluşturuldu
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '409':
          description: E-posta zaten kayıtlı
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /auth/login:
    post:
      tags: [Auth]
      summary: Giriş yap
      description: E-posta ve şifre ile giriş yaparak JWT döner.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Giriş başarılı
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /auth/forgot-password:
    post:
      tags: [Auth]
      summary: Şifre sıfırlama e-postası gönder
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ForgotPasswordRequest'
      responses:
        '200':
          description: Sıfırlama e-postası gönderildi
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
        '400':
          $ref: '#/components/responses/ValidationError'

  /auth/resend-verification:
    post:
      tags: [Auth]
      summary: Doğrulama e-postasını tekrar gönder
      description: Kayıt sonrası e-posta doğrulama linkini yeniden tetikler.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email:
                  type: string
                  format: email
      responses:
        '200':
          description: Doğrulama e-postası gönderildi
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
        '400':
          $ref: '#/components/responses/ValidationError'

  /auth/me:
    get:
      tags: [Auth]
      summary: Mevcut kullanıcı bilgisi
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Kullanıcı profil ve yetki bilgisi
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MeResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
    delete:
      tags: [Auth]
      summary: Hesap sil (KVKK / Unutulma Hakkı)
      description: Kullanıcının hesabını ve bağlı aktif petlerini soft delete yapar.
      security:
        - bearerAuth: []
      responses:
        '204':
          description: Hesap silindi
        '401':
          $ref: '#/components/responses/Unauthorized'

  # ---- Profile ----
  /profiles/me:
    put:
      tags: [Profile]
      summary: Kullanıcı profilini güncelle
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProfileUpdateRequest'
      responses:
        '200':
          description: Profil güncellendi
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OwnerResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /profiles/me/photo:
    post:
      tags: [Profile]
      summary: Profil fotoğrafı yükle/güncelle
      description: |
        Kullanıcının profil fotoğrafını yükler veya günceller. Fotoğraf Supabase
        Storage'daki `owner-photos` bucket'ına kullanıcı ID'si anahtarıyla (x-upsert)
        yazılır; kullanıcının önceki fotoğrafı varsa önce silinir. Max 15MB; JPEG,
        PNG, WebP kabul edilir. Aynı uç `/owners/me/photo`, `/api/profiles/me/photo`
        ve `/api/owners/me/photo` alias'larından da erişilebilir.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
      responses:
        '200':
          description: Profil fotoğrafı yüklendi/güncellendi
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OwnerResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '413':
          description: Dosya 15MB sınırını aşıyor (EC-06)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    delete:
      tags: [Profile]
      summary: Profil fotoğrafını sil
      description: |
        Kullanıcının profil fotoğrafını siler: `profiles.profile_photo_url` NULL
        yapılır ve `owner-photos` bucket'ındaki dosya kaldırılır. Idempotenttir —
        silinecek fotoğraf zaten yoksa da 204 döner.
      security:
        - bearerAuth: []
      responses:
        '204':
          description: Profil fotoğrafı silindi (veya zaten yoktu)
        '401':
          $ref: '#/components/responses/Unauthorized'

  # ---- Pets ----
  /pets:
    post:
      tags: [Pets]
      summary: Yeni hayvan ekle
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PetCreateRequest'
      responses:
        '201':
          description: Hayvan oluşturuldu
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PetResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'

    get:
      tags: [Pets]
      summary: Sahibin aktif hayvanlarını listele
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Hayvan listesi
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PetResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /pets/{id}:
    get:
      tags: [Pets]
      summary: Hayvan detayı
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/PathId'
      responses:
        '200':
          description: Hayvan detayı
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PetResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

    put:
      tags: [Pets]
      summary: Hayvan bilgilerini güncelle
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/PathId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PetUpdateRequest'
      responses:
        '200':
          description: Hayvan güncellendi
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PetResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

    delete:
      tags: [Pets]
      summary: Hayvan sil (soft delete)
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/PathId'
      responses:
        '204':
          description: Hayvan pasife alındı
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /pets/{id}/weight-history:
    get:
      tags: [Pets]
      summary: Hayvanın kilo geçmişini listele
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/PathId'
        - name: page
          in: query
          required: false
          schema:
            type: integer
            default: 0
        - name: size
          in: query
          required: false
          schema:
            type: integer
            default: 20
        - name: sort
          in: query
          required: false
          schema:
            type: string
      responses:
        '200':
          description: Kilo geçmişi listesi veya sayfalı sonuç
          content:
            application/json:
              schema:
                oneOf:
                  - type: array
                    items:
                      $ref: '#/components/schemas/PetWeightHistoryResponse'
                  - $ref: '#/components/schemas/PagePetWeightHistoryResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /pets/{id}/health-history:
    get:
      tags: [Pets]
      summary: Pet Sağlık Geçmişi ve Klinik Detaylarını Getir
      description: |
        Evcil hayvanın kilo geçmişi, muayene ziyaretleri, tedavi/ilaç kayıtları ve hekim önerilerini tek bir yanıtta döner.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/PathId'
      responses:
        '200':
          description: Sağlık geçmişi başarıyla getirildi
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PetHealthHistoryResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /pets/{id}/photo:
    post:
      tags: [Pets]
      summary: Hayvan fotoğrafı yükle (Max 15MB)
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/PathId'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
      responses:
        '200':
          description: Fotoğraf yüklendi
          content:
            application/json:
              schema:
                type: object
                properties:
                  photoUrl:
                    type: string
                    format: uri
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '413':
          description: Dosya boyutu çok büyük
        '415':
          description: Desteklenmeyen dosya türü
    delete:
      tags: [Pets]
      summary: Hayvan fotoğrafını sil
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/PathId'
      responses:
        '204':
          description: Fotoğraf silindi
        '401':
          $ref: '#/components/responses/Unauthorized'

  /pets/{id}/visits:
    get:
      tags: [Visits]
      summary: Hayvanın tüm ziyaret geçmişi
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/PathId'
      responses:
        '200':
          description: Ziyaret listesi
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/VisitDetailResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /pets/{petId}/treatments:
    get:
      tags: [Treatments]
      summary: Pet'in tüm tedavilerini listele
      security:
        - bearerAuth: []
      parameters:
        - name: petId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Tedavi listesi
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TreatmentEntryResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /pets/{id}/recommendations:
    get:
      tags: [Recommendations]
      summary: Hayvanın tüm önerileri
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/PathId'
      responses:
        '200':
          description: Öneri listesi
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/RecommendationDetailResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

  # ---- Visits ----
  /visits/owner:
    get:
      tags: [Visits]
      summary: Sahibin tüm aktif hayvanlarının ziyaret geçmişi
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Ziyaret listesi
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/VisitResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /visits/vet:
    get:
      tags: [Visits]
      summary: Hekime atanmış ziyaretler
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Ziyaret listesi
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/VisitResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /visits/code/{code}:
    get:
      tags: [Visits]
      summary: 6 haneli kod ile hasta bul
      description: |
        `clinicId` opsiyoneldir. Verilmezse hekimin tek bir aktif klinik üyeliği varsa
        otomatik kullanılır (`VisitController.createVisit` ile aynı desen). Birden fazla
        aktif üyelikte `clinicId` zorunludur (400), hiç aktif üyelik yoksa 401 döner.
      security:
        - bearerAuth: []
      parameters:
        - name: code
          in: path
          required: true
          schema:
            type: string
        - name: clinicId
          in: query
          required: false
          description: Belirtilmezse hekimin tek aktif klinik üyeliğinden otomatik çözümlenir.
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Hasta bilgisi ve geçmiş ziyaretleri
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PetWithVisitsResponse'
        '400':
          description: clinicId verilmedi ve hekim birden fazla klinikte aktif — clinicId zorunlu
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /visits:
    post:
      tags: [Visits]
      summary: Yeni ziyaret başlat
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VisitCreateRequest'
      responses:
        '201':
          description: Ziyaret başlatıldı
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VisitResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          description: Açık ziyaret zaten mevcut

  /visits/{id}/close:
    put:
      tags: [Visits]
      summary: Ziyareti tamamla/kapat
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/PathId'
      responses:
        '200':
          description: Ziyaret kapatıldı
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VisitResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          description: Ziyaret zaten kapalı

  # ---- Treatments ----
  /visits/{visitId}/treatments:
    post:
      tags: [Treatments]
      summary: Tedavi girişi ekle
      security:
        - bearerAuth: []
      parameters:
        - name: visitId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TreatmentCreateRequest'
      responses:
        '201':
          description: Tedavi girişi kaydedildi
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TreatmentEntryResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          description: Ziyaret kapalı
    get:
      tags: [Treatments]
      summary: Ziyaretin tedavi girişlerini listele
      security:
        - bearerAuth: []
      parameters:
        - name: visitId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Tedavi listesi
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TreatmentEntryResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /treatments/{id}:
    put:
      tags: [Treatments]
      summary: Tedavi kaydını güncelle (15 dakika penceresi)
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/PathId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TreatmentUpdateRequest'
      responses:
        '200':
          description: Tedavi güncellendi
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TreatmentEntryResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: 15 dakikalık düzenleme penceresi doldu
    delete:
      tags: [Treatments]
      summary: Tedavi kaydını sil (15 dakika penceresi)
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/PathId'
      responses:
        '204':
          description: Tedavi kaydı silindi
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: 15 dakikalık silme penceresi doldu

  /treatments/{id}/attachment/upload-url:
    post:
      tags: [Treatments]
      summary: Tedavi eki için güvenli yükleme URL'i al
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/PathId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [fileName, contentType]
              properties:
                fileName:
                  type: string
                contentType:
                  type: string
      responses:
        '200':
          description: Yükleme URL'i üretildi
          content:
            application/json:
              schema:
                type: object
                properties:
                  uploadUrl:
                    type: string
                  attachmentUrl:
                    type: string

  /treatments/{id}/attachment/read-url:
    get:
      tags: [Treatments]
      summary: Tedavi ekini görüntülemek için imzalı okuma URL'i al
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/PathId'
      responses:
        '200':
          description: Okuma URL'i
          content:
            application/json:
              schema:
                type: object
                properties:
                  readUrl:
                    type: string

  # ---- Recommendations ----
  /visits/{visitId}/recommendations:
    post:
      tags: [Recommendations]
      summary: Bakım önerisi ekle
      security:
        - bearerAuth: []
      parameters:
        - name: visitId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RecommendationCreateRequest'
      responses:
        '201':
          description: Öneri kaydedildi
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecommendationResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          description: Ziyaret kapalı

  # ---- Notifications ----
  /notifications:
    get:
      tags: [Notifications]
      summary: Sahibin tüm bildirimleri
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Bildirim listesi ve okunmamış sayısı
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /notifications/unread-count:
    get:
      tags: [Notifications]
      summary: Okunmamış bildirim sayısı
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Okunmamış bildirim sayısı
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnreadCountResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /notifications/{id}/read:
    patch:
      tags: [Notifications]
      summary: Bildirimi okundu işaretle
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/PathId'
      responses:
        '204':
          description: Bildirim okundu olarak işaretlendi
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /notifications/read-all:
    patch:
      tags: [Notifications]
      summary: Tüm bildirimleri okundu işaretle
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Tüm bildirimler okundu işaretlendi
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnreadCountResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

  # ---- Devices ----
  /devices/register:
    post:
      tags: [Devices]
      summary: FCM cihaz token kaydı
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeviceRegisterRequest'
      responses:
        '201':
          description: Cihaz token'ı kaydedildi
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /devices/unregister:
    post:
      tags: [Devices]
      summary: FCM cihaz token silme (logout)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeviceRegisterRequest'
      responses:
        '204':
          description: Cihaz token'ı silindi
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'

  # ---- Clinics & Invites ----
  /clinics/{clinicId}/invites:
    post:
      tags: [Clinics]
      summary: Kliniğe personel davet et
      description: Klinik yöneticisi (admin) tarafından yeni veteriner/personel davetiyesi oluşturulur.
      security:
        - bearerAuth: []
      parameters:
        - name: clinicId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClinicInviteCreateRequest'
      responses:
        '201':
          description: Davetiye oluşturuldu
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClinicInviteResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /clinics/invites/accept:
    post:
      tags: [Clinics]
      summary: Davetiyeyi kabul et
      description: Kullanıcı kendisine gelen davet token'ı ile kliniğe katılır.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AcceptInviteRequest'
      responses:
        '200':
          description: Davet kabul edildi ve üyelik aktifleştirildi
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClinicMembershipResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: Geçersiz veya süresi dolmuş davet token'ı

  /clinics/invites/register-and-accept:
    post:
      tags: [Clinics]
      summary: Davetle kayıt ol ve kliniğe katıl (Atomik, Public)
      description: |
        INT-FINDING-02 fix: public register + authenticated accept iki adımlı akışının aksine,
        yeni bir veteriner hesabı oluşturur ve klinik üyeliğini TEK istekte atomik olarak bağlar;
        başarılı oturum tokenları döner. Supabase Dashboard'daki e-posta doğrulama ayarına
        bağımlı değildir — geçerli, e-posta eşleşmesi doğrulanmış davet token'ı kimliği zaten
        kanıtlamış sayılır. Idempotent: kısmi bir önceki denemeden sonra aynı istekle güvenle
        retry edilebilir.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, email, password, token]
              properties:
                name:
                  type: string
                  example: "Dr. Ahmet Yılmaz"
                email:
                  type: string
                  format: email
                password:
                  type: string
                  minLength: 6
                phone:
                  type: string
                token:
                  type: string
                  description: Ham davet kodu (rawToken)
      responses:
        '201':
          description: Hesap oluşturuldu/bulundu, klinik üyeliği bağlandı, oturum tokenları döner
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          description: Davet farklı bir e-posta adresi için oluşturulmuş
        '404':
          description: Geçersiz davet token'ı
        '409':
          description: Bu e-posta ile FARKLI bir şifreyle zaten kayıtlı bir hesap var

  /clinics/invites/validate:
    get:
      tags: [Clinics]
      summary: Davet kodunu doğrula (Public)
      description: |
        Davet kodunu oturum açmadan doğrular (frontend onboarding ön-kontrolü).
        Gizlilik gereği yanıt gövdesinde davet e-postası DÖNÜLMEZ.
      parameters:
        - name: token
          in: query
          required: true
          description: Ham davet kodu (rawToken)
          schema:
            type: string
      responses:
        '200':
          description: Davet geçerli
          content:
            application/json:
              schema:
                type: object
                properties:
                  valid:
                    type: boolean
                    example: true
                  clinicId:
                    type: string
                    format: uuid
                  clinicName:
                    type: string
                    example: "Kadıköy Veteriner Kliniği"
        '400':
          description: Davet iptal edilmiş
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "Bu davet iptal edilmiş."
        '404':
          description: Geçersiz davet kodu
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "Geçersiz davet kodu."
        '409':
          description: Davet kodu daha önce kullanılmış
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "Bu davet kodu daha önce kullanılmış."
        '410':
          description: Davet kodunun süresi dolmuş
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "Bu davet kodunun süresi dolmuş."

  /clinics/invites/{inviteId}:
    delete:
      tags: [Clinics]
      summary: Davetiyeyi iptal et (Revoke)
      security:
        - bearerAuth: []
      parameters:
        - name: inviteId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Davetiye iptal edildi
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  # ---- AI Chat ----
  /api/v1/ai/chat:
    post:
      tags: [AI Chat]
      summary: AI Asistan ile sohbet et
      description: |
        Kullanıcının evcil hayvanıyla ilgili sorularını yanıtlayan Google Gemini destekli asistan.
        Acil durum tespiti, PII maskeleme, opt-in onay kontrolü ve günlük kota sınırlaması içerir.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AiChatRequest'
      responses:
        '200':
          description: AI yanıtı üretildi
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AiChatResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Açık rıza (opt-in) onayı eksik veya pet sahipliği yetkisi yok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Idempotency anahtarı uyuşmazlığı
        '429':
          description: Günlük mesaj kotası aşıldı (50 mesaj/gün)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/ai/history:
    get:
      tags: [AI Chat]
      summary: AI sohbet geçmişini getir
      description: Giriş yapmış kullanıcının (veya belirtilen petId'nin) AI sohbet geçmişini döner.
      security:
        - bearerAuth: []
      parameters:
        - name: petId
          in: query
          required: false
          schema:
            type: string
            format: uuid
        - name: page
          in: query
          required: false
          schema:
            type: integer
            default: 0
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 50
      responses:
        '200':
          description: Mesaj geçmişi listesi
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ChatMessageResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

    delete:
      tags: [AI Chat]
      summary: Tüm sohbet geçmişini sil (KVKK Unutulma Hakkı)
      security:
        - bearerAuth: []
      responses:
        '204':
          description: Tüm sohbet geçmişi başarıyla silindi
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/v1/ai/conversations/{conversationId}:
    delete:
      tags: [AI Chat]
      summary: Belirli bir konuşma oturumunu sil
      security:
        - bearerAuth: []
      parameters:
        - name: conversationId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Konuşma oturumu silindi
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/v1/ai/messages/{id}:
    delete:
      tags: [AI Chat]
      summary: Tekil sohbet mesajını sil
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/PathId'
      responses:
        '204':
          description: Mesaj silindi
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

# ================================================================
# COMPONENTS
# ================================================================
components:

  # ---- Security ----
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: "Supabase JWT. Authorization: Bearer <token>"

  # ---- Parameters ----
  parameters:
    PathId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid

  # ---- Reusable Responses ----
  responses:
    ValidationError:
      description: Validation hatası
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            status: 400
            error: VALIDATION_ERROR
            message: "name alanı zorunludur"
            timestamp: "2026-07-29T14:32:11Z"

    Unauthorized:
      description: JWT eksik veya geçersiz
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            status: 401
            error: UNAUTHORIZED
            message: "Kimlik doğrulama gerekli"
            timestamp: "2026-07-29T14:32:11Z"

    Forbidden:
      description: Rol yetkisiz veya erişim izni yok
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            status: 403
            error: FORBIDDEN
            message: "Bu işlem için yetkiniz yok"
            timestamp: "2026-07-29T14:32:11Z"

    NotFound:
      description: Kaynak bulunamadı
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            status: 404
            error: NOT_FOUND
            message: "Kayıt bulunamadı"
            timestamp: "2026-07-29T14:32:11Z"

  # ---- Schemas ----
  schemas:

    # -- Error --
    ErrorResponse:
      type: object
      required: [status, error, message, timestamp]
      properties:
        status:
          type: integer
          example: 400
        error:
          type: string
          example: VALIDATION_ERROR
        message:
          type: string
          example: "Doğrulama hatası"
        timestamp:
          type: string
          format: date-time
          example: "2026-07-29T14:32:11Z"

    # -- Auth & Profile --
    RegisterRequest:
      type: object
      required: [email, password, name, role]
      properties:
        email:
          type: string
          format: email
          example: "ayse@example.com"
        password:
          type: string
          minLength: 8
          example: "gucluSifre123"
        name:
          type: string
          minLength: 1
          maxLength: 100
          example: "Ayşe Yılmaz"
        phone:
          type: string
          nullable: true
          maxLength: 20
          example: "+905551234567"
        role:
          type: string
          enum: [owner, vet_staff]
          example: "owner"

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string

    ForgotPasswordRequest:
      type: object
      required: [email]
      properties:
        email:
          type: string
          format: email

    AuthResponse:
      type: object
      properties:
        accessToken:
          type: string
        refreshToken:
          type: string
        expiresIn:
          type: integer
          example: 3600
        user:
          $ref: '#/components/schemas/MeResponse'

    ProfileUpdateRequest:
      type: object
      properties:
        fullName:
          type: string
          minLength: 1
          maxLength: 100
          example: "Ayşe Yılmaz"
        phone:
          type: string
          nullable: true
          maxLength: 20
          example: "+905551234567"

    OwnerResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        fullName:
          type: string
          example: "Ayşe Yılmaz"
        email:
          type: string
          format: email
          example: "ayse@example.com"
        phone:
          type: string
          nullable: true
          example: "+905551234567"
        surname:
          type: string
          nullable: true
          example: "Yılmaz"
        address:
          type: string
          nullable: true
          example: "Kadıköy, İstanbul"
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        profilePhotoUrl:
          type: string
          format: uri
          nullable: true
          description: Profil fotoğrafının public URL'i (fotoğraf yoksa null)
          example: "https://xxx.supabase.co/storage/v1/object/public/owner-photos/550e8400-...?v=1"

    ClinicMembershipResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        clinicId:
          type: string
          format: uuid
        userId:
          type: string
          format: uuid
        role:
          type: string
          enum: [doctor, staff]
          example: "doctor"
        status:
          type: string
          enum: [invited, active, disabled]
          example: "active"
        isClinicAdmin:
          type: boolean
          example: false
        joinedAt:
          type: string
          format: date-time
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    MeResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        role:
          type: string
          enum: [owner, vet_staff]
        clinicMemberships:
          type: array
          items:
            $ref: '#/components/schemas/ClinicMembershipResponse'
        profile:
          $ref: '#/components/schemas/OwnerResponse'

    # -- Pets --
    PetCreateRequest:
      type: object
      required: [name, species, gender]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
          example: "Boncuk"
        species:
          type: string
          minLength: 1
          example: "Kedi"
        breed:
          type: string
          nullable: true
          example: "Tekir"
        gender:
          type: string
          enum: [male, female, unknown]
          example: "male"
        birthDate:
          type: string
          format: date
          nullable: true
          example: "2022-04-15"
        estimatedBirthYear:
          type: integer
          nullable: true
          example: 2022
        photoUrl:
          type: string
          nullable: true
          format: uri
        weight:
          type: number
          format: double
          nullable: true
          example: 4.5
        microchipNo:
          type: string
          nullable: true
          example: "900215000123456"
        isSpayedOrNeutered:
          type: boolean
          nullable: true
          example: true
        bloodType:
          type: string
          nullable: true
          example: "A"
        color:
          type: string
          nullable: true
          example: "Sarman"
        allergies:
          type: string
          nullable: true
          example: "Tavuk proteini"
        chronicIllnesses:
          type: string
          nullable: true
          example: "Yok"

    PetUpdateRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        species:
          type: string
        breed:
          type: string
          nullable: true
        gender:
          type: string
          enum: [male, female, unknown]
        birthDate:
          type: string
          format: date
          nullable: true
        estimatedBirthYear:
          type: integer
          nullable: true
        weight:
          type: number
          format: double
          nullable: true
        microchipNo:
          type: string
          nullable: true
        isSpayedOrNeutered:
          type: boolean
          nullable: true
        bloodType:
          type: string
          nullable: true
        color:
          type: string
          nullable: true
        allergies:
          type: string
          nullable: true
        chronicIllnesses:
          type: string
          nullable: true

    PetResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        ownerId:
          type: string
          format: uuid
        name:
          type: string
          example: "Boncuk"
        species:
          type: string
          example: "Kedi"
        breed:
          type: string
          nullable: true
          example: "Tekir"
        gender:
          type: string
          enum: [male, female, unknown]
          example: "male"
        birthDate:
          type: string
          format: date
          nullable: true
          example: "2022-04-15"
        estimatedBirthYear:
          type: integer
          nullable: true
          example: 2022
        photoUrl:
          type: string
          nullable: true
          format: uri
        weight:
          type: number
          format: double
          nullable: true
          example: 4.5
        microchipNo:
          type: string
          nullable: true
        isSpayedOrNeutered:
          type: boolean
          nullable: true
          example: true
        bloodType:
          type: string
          nullable: true
        color:
          type: string
          nullable: true
        allergies:
          type: string
          nullable: true
        chronicIllnesses:
          type: string
          nullable: true
        uniqueCode:
          type: string
          minLength: 6
          maxLength: 6
          pattern: "^[A-HJ-KMN-Z2-9]{6}$"
          example: "7K4R9M"
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    PetWeightHistoryResponse:
      type: object
      properties:
        date:
          type: string
          format: date
          example: "2026-03-15"
        weight:
          type: number
          format: double
          example: 4.5

    PagePetWeightHistoryResponse:
      type: object
      properties:
        content:
          type: array
          items:
            $ref: '#/components/schemas/PetWeightHistoryResponse'
        totalPages:
          type: integer
          example: 1
        totalElements:
          type: integer
          example: 3
        size:
          type: integer
          example: 20
        number:
          type: integer
          example: 0
        first:
          type: boolean
          example: true
        last:
          type: boolean
          example: true
        empty:
          type: boolean
          example: false

    PetHealthHistoryResponse:
      type: object
      properties:
        petId:
          type: string
          format: uuid
        name:
          type: string
        species:
          type: string
        breed:
          type: string
        gender:
          type: string
        currentWeight:
          type: number
          format: double
        bloodType:
          type: string
        microchipNo:
          type: string
        isSpayedOrNeutered:
          type: boolean
        allergies:
          type: string
        chronicIllnesses:
          type: string
        weightHistory:
          type: array
          items:
            $ref: '#/components/schemas/PetWeightHistoryResponse'
        visits:
          type: array
          items:
            $ref: '#/components/schemas/VisitSummaryDto'
        treatments:
          type: array
          items:
            $ref: '#/components/schemas/TreatmentSummaryDto'
        recommendations:
          type: array
          items:
            $ref: '#/components/schemas/RecommendationSummaryDto'

    VisitSummaryDto:
      type: object
      properties:
        id:
          type: string
          format: uuid
        clinicId:
          type: string
          format: uuid
        vetStaffId:
          type: string
          format: uuid
        status:
          type: string
        chiefComplaint:
          type: string
        startedAt:
          type: string
          format: date-time
        endedAt:
          type: string
          format: date-time

    TreatmentSummaryDto:
      type: object
      properties:
        id:
          type: string
          format: uuid
        visitId:
          type: string
          format: uuid
        type:
          type: string
        title:
          type: string
        description:
          type: string
        status:
          type: string
        startDate:
          type: string
          format: date-time
        endDate:
          type: string
          format: date-time

    RecommendationSummaryDto:
      type: object
      properties:
        id:
          type: string
          format: uuid
        visitId:
          type: string
          format: uuid
        type:
          type: string
        description:
          type: string
        createdAt:
          type: string
          format: date-time

    PetWithVisitsResponse:
      allOf:
        - $ref: '#/components/schemas/PetResponse'
        - type: object
          properties:
            visits:
              type: array
              items:
                $ref: '#/components/schemas/VisitDetailResponse'

    # -- Visits --
    VisitCreateRequest:
      type: object
      required: [petId]
      properties:
        petId:
          type: string
          format: uuid
        chiefComplaint:
          type: string
          nullable: true
          example: "Halsizlik ve kusma"

    VisitResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        petId:
          type: string
          format: uuid
        vetStaffId:
          type: string
          format: uuid
        status:
          type: string
          enum: [ongoing, completed]
        chiefComplaint:
          type: string
          nullable: true
          example: "Akut kusma ve iştahsızlık"
        startedAt:
          type: string
          format: date-time
        endedAt:
          type: string
          format: date-time
          nullable: true

    VisitDetailResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        vetStaffId:
          type: string
          format: uuid
        vetStaffName:
          type: string
          example: "Dr. Mehmet Yılmaz"
        status:
          type: string
          enum: [ongoing, completed]
        chiefComplaint:
          type: string
          nullable: true
        startedAt:
          type: string
          format: date-time
        endedAt:
          type: string
          format: date-time
          nullable: true
        treatments:
          type: array
          items:
            $ref: '#/components/schemas/TreatmentEntryResponse'
        recommendations:
          type: array
          items:
            $ref: '#/components/schemas/RecommendationResponse'

    # -- Treatments --
    TreatmentCreateRequest:
      type: object
      required: [type, title]
      properties:
        type:
          type: string
          enum: [medication, xray, lab_result, note, vaccine, surgery]
          example: "medication"
        title:
          type: string
          minLength: 1
          maxLength: 200
          example: "Amoksisilin 250mg"
        description:
          type: string
          nullable: true
          example: "Günde 2 kez, 7 gün"
        attachmentUrl:
          type: string
          nullable: true
          format: uri

    TreatmentUpdateRequest:
      type: object
      properties:
        type:
          type: string
          enum: [medication, xray, lab_result, note, vaccine, surgery]
        title:
          type: string
          minLength: 1
          maxLength: 200
        description:
          type: string
          nullable: true
        attachmentUrl:
          type: string
          nullable: true
          format: uri

    TreatmentEntryResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        visitId:
          type: string
          format: uuid
        type:
          type: string
          enum: [medication, xray, lab_result, note, vaccine, surgery]
        title:
          type: string
        description:
          type: string
          nullable: true
        attachmentUrl:
          type: string
          nullable: true
          format: uri
        enteredBy:
          type: string
          format: uuid
        editable:
          type: boolean
          description: "true ise 15 dakikalık düzenleme penceresi açık"
        createdAt:
          type: string
          format: date-time

    # -- Recommendations --
    RecommendationCreateRequest:
      type: object
      required: [type, description]
      properties:
        type:
          type: string
          enum: [food, litter, other]
          example: "food"
        description:
          type: string
          minLength: 1
          example: "Royal Canin Gastrointestinal, günde 2 öğün"

    RecommendationResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        visitId:
          type: string
          format: uuid
        type:
          type: string
          enum: [food, litter, other]
        description:
          type: string
        createdAt:
          type: string
          format: date-time

    RecommendationDetailResponse:
      allOf:
        - $ref: '#/components/schemas/RecommendationResponse'
        - type: object
          properties:
            vetStaffName:
              type: string
              example: "Dr. Mehmet Yılmaz"

    # -- Notifications --
    NotificationType:
      type: string
      enum:
        - VACCINE
        - VISIT
        - TREATMENT
        - RECOMMENDATION
        - SYSTEM

    NotificationResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        type:
          $ref: '#/components/schemas/NotificationType'
        title:
          type: string
          example: "Boncuk için yeni tedavi kaydı"
        body:
          type: string
          nullable: true
        treatmentEntryId:
          type: string
          format: uuid
          nullable: true
        isRead:
          type: boolean
        readAt:
          type: string
          format: date-time
          nullable: true
        sentAt:
          type: string
          format: date-time

    NotificationListResponse:
      type: object
      properties:
        notifications:
          type: array
          items:
            $ref: '#/components/schemas/NotificationResponse'
        unreadCount:
          type: integer
          format: int64
          example: 3

    UnreadCountResponse:
      type: object
      properties:
        unreadCount:
          type: integer
          format: int64
          example: 3

    # -- Devices --
    DeviceRegisterRequest:
      type: object
      required: [fcmToken, platform]
      properties:
        fcmToken:
          type: string
          minLength: 1
        platform:
          type: string
          enum: [ios, android]

    # -- Clinics & Invites --
    ClinicInviteCreateRequest:
      type: object
      required: [email, role]
      properties:
        email:
          type: string
          format: email
          example: "vet@klinik.com"
        role:
          type: string
          enum: [doctor, staff]
          example: "doctor"

    ClinicInviteResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        clinicId:
          type: string
          format: uuid
        email:
          type: string
          format: email
        inviteToken:
          type: string
          example: "inv_9a8b7c6d5e4f"
        expiresAt:
          type: string
          format: date-time
        createdAt:
          type: string
          format: date-time

    AcceptInviteRequest:
      type: object
      required: [token]
      properties:
        token:
          type: string
          minLength: 1
          example: "inv_9a8b7c6d5e4f"

    # -- AI Chat --
    ChatMessageDto:
      type: object
      required: [role, content]
      properties:
        role:
          type: string
          enum: [user, model]
          example: "user"
        content:
          type: string
          example: "Kedim bugün biraz halsiz."

    AiChatRequest:
      type: object
      required: [message]
      properties:
        conversationId:
          type: string
          format: uuid
          nullable: true
        clientMessageId:
          type: string
          nullable: true
          example: "cli_123456"
        petId:
          type: string
          format: uuid
          nullable: true
        message:
          type: string
          minLength: 1
          example: "Kedimin ateşi var gibi ne yapmalıyım?"
        aiConsentGiven:
          type: boolean
          default: true
          example: true
        history:
          type: array
          items:
            $ref: '#/components/schemas/ChatMessageDto'

    AiChatResponse:
      type: object
      properties:
        messageId:
          type: string
          format: uuid
        conversationId:
          type: string
          format: uuid
        emergency:
          type: boolean
          example: false
        reply:
          type: string
          example: "Kedinizin durumunu takip etmek için..."
        disclaimer:
          type: string
          example: "YASAL UYARI: Bu yapay zeka asistanı..."
        model:
          type: string
          example: "gemini-2.5-flash"
        promptVersion:
          type: string
          example: "v1.3-security-guardrail"
        createdAt:
          type: string
          format: date-time

    ChatMessageResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        conversationId:
          type: string
          format: uuid
        role:
          type: string
          enum: [user, model]
        content:
          type: string
        emergency:
          type: boolean
        createdAt:
          type: string
          format: date-time
          