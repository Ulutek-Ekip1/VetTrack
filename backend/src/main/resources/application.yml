spring:
  datasource:
    url: ${SUPABASE_DB_URL}
    username: ${SUPABASE_DB_USER}
    password: ${SUPABASE_DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: ${SPRING_JPA_HIBERNATE_DDL_AUTO:validate}
    show-sql: true
  servlet:
    multipart:
      enabled: true
      max-file-size: 15MB
      max-request-size: 16MB
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: ${SPRING_FLYWAY_BASELINE_VERSION:2}
    validate-on-migrate: true
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${SUPABASE_JWKS_URL}
          jws-algorithms: ES256

supabase:
  url: ${SUPABASE_URL:https://your-supabase-url.supabase.co}
  service-key: ${SUPABASE_SERVICE_KEY:}
  jwt:
    jwks-url: ${SUPABASE_JWKS_URL}
    issuer: ${SUPABASE_JWT_ISSUER}
  storage:
    url: ${SUPABASE_STORAGE_URL}
    service-key: ${SUPABASE_SERVICE_KEY}

firebase:
  credentials-path: ${FIREBASE_CREDENTIALS_PATH}

sentry:
  dsn: ${SENTRY_DSN:}
  traces-sample-rate: ${SENTRY_TRACES_SAMPLE_RATE:0.1}
  send-default-pii: false

app:
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:8080,http://127.0.0.1:3000,http://127.0.0.1:8080}
  rate-limiting:
    trusted-proxy-header-enabled: ${TRUSTED_PROXY_HEADER_ENABLED:false}
    endpoints:
      - paths:
          - /auth/login
          - /api/auth/login
        max-requests: 10
        window-seconds: 60
      - paths:
          - /auth/register
          - /api/auth/register
        max-requests: 10
        window-seconds: 60
      - paths:
          - /auth/resend-verification
          - /api/auth/resend-verification
        max-requests: 3
        window-seconds: 3600

gemini:
  api-key: ${GEMINI_API_KEY:}
  model: ${GEMINI_MODEL:gemini-2.5-flash}

  server:
  port: ${PORT:8080}
  